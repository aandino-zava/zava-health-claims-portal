version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      workflow-maintenance:
        patterns: ['*']
        update-types: [minor, patch]
    # Major workflow upgrades are reviewed as planned maintenance.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      container-maintenance:
        patterns: ['*']
        update-types: [minor, patch]
    # Keep the tested Python 3.12 runtime; allow patch and digest refreshes.
    ignore:
      - dependency-name: python
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      python-maintenance:
        patterns: ['*']
        update-types: [minor, patch]
