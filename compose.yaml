services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: claims
      POSTGRES_USER: claims
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - claims-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claims -d claims"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      ENVIRONMENT: development
      AUTH_MODE: development
      DATABASE_URL: postgresql+psycopg://claims:local-demo-only@db/claims
      SEED_DEMO: 'true'
    depends_on:
      db:
        condition: service_healthy
volumes:
  claims-data:
