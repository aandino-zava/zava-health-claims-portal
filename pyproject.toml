[project]
name = "health-claims-portal"
version = "0.1.0"
description = "Portable synthetic health claims demo with an agent-ready API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3", "PyJWT[crypto]>=2.10,<3"
]
[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
    "pytest-cov>=6,<8",
    "openapi-spec-validator>=0.7,<0.10",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["I"] # Preserve historical migration sources.
